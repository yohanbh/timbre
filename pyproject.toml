[project]
name = "timbre"
version = "0.1.0"
description = "Audio similarity search on a hand-written HNSW index"
requires-python = ">=3.10"
dependencies = [
    "torch==2.13.0",
    "transformers==4.53.0",
    "numpy==2.2.6",
    "tqdm==4.67.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
plots = ["matplotlib>=3.8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = ["slow: requires GPU and model load"]
